<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Invite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Container */
        .header-container {
            background: #ff4d6d;
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin: 0;
        }

        /* Middle Card Container */
        .main-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .valentine-card {
            background: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .valentine-card:hover {
            transform: translateY(-5px);
        }

        .question-text {
            color: #590d22;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        /* Buttons */
        .btn-love {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            margin: 10px;
            transition: all 0.3s;
        }

        .btn-love:hover {
            background-color: #c9184a;
            color: white;
            transform: scale(1.1);
        }

        .btn-outline-love {
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            margin: 10px;
            transition: all 0.3s;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <h1>Valentine's Day Invite</h1>
    </header>

    <main class="main-container">
        <div class="card valentine-card">
            <div class="card-body">
                <div class="heart-icon">❤️</div>
                <h2 class="question-text">Will You be my Valentine?</h2>
                <div class="d-flex justify-content-center mt-4">
                    <button class="btn btn-love" onclick="sayYes()">Yes</button>
                    <button class="btn btn-outline-love" id="noBtn" onmouseover="moveNoButton()">No</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function sayYes() {
            alert("Yay! I knew you'd say yes! ❤️");
            document.querySelector('.question-text').innerHTML = "It's a Date! See you soon! ✨";
            document.getElementById('noBtn').style.display = 'none';
        }

        function moveNoButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>

</body>
</html>
