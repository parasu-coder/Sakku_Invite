<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Invite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Container */
        .header-container {
            background: #ff4d6d;
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom-left-radius: 50% 10%;
            border-bottom-right-radius: 50% 10%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin: 0;
        }

        /* Middle Card Container */
        .main-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .valentine-card {
            background: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
        }

        .question-text {
            color: #590d22;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        /* Buttons */
        .btn-love {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            margin: 10px;
            transition: all 0.3s;
        }

        .btn-love:hover {
            background-color: #c9184a;
            color: white;
            transform: scale(1.05);
        }

        .btn-outline-love {
            border: 2px solid #ff758f;
            color: #ff758f;
            background: transparent;
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            margin: 10px;
        }

        /* Modal / Pros & Cons Styling */
        .modal-content {
            border-radius: 25px;
            border: none;
            background-color: #fff0f3;
        }

        .comparison-card {
            border-radius: 20px;
            border: none;
            height: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .pros-card {
            background-color: #ffffff;
            border-top: 5px solid #4ade80;
        }

        .cons-card {
            background-color: #ffffff;
            border-top: 5px solid #ff4d6d;
        }

        .card-title {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .list-unstyled li {
            margin-bottom: 15px;
            padding-left: 25px;
            position: relative;
        }

        .list-unstyled li::before {
            content: "💖";
            position: absolute;
            left: 0;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header class="header-container">
        <h1>Valentine's Day Invite</h1>
    </header>

    <main class="main-container">
        <div class="card valentine-card">
            <div class="card-body">
                <div class="heart-icon">❤️</div>
                <h2 class="question-text" id="mainQuestion">Will You be my Valentine?</h2>
                <div class="d-flex justify-content-center mt-4">
                    <button class="btn btn-love" onclick="sayYes()">Yes</button>
                    <button class="btn btn-outline-love" data-bs-toggle="modal" data-bs-target="#prosConsModal">No</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="prosConsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0">
                    <h3 class="modal-title w-100 text-center" style="color: #ff4d6d;">Wait! Let's look at the facts...</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="card comparison-card pros-card p-3">
                                <div class="card-body">
                                    <h4 class="card-title text-success">Pros</h4>
                                    <ul class="list-unstyled">
                                        <li>Your lifetime best friend</li>
                                        <li>A partner in Crime</li>
                                        <li>A person to listen to all your stories</li>
                                        <li>Person to fuck around with 🫣</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card comparison-card cons-card p-3">
                                <div class="card-body">
                                    <h4 class="card-title text-danger">Cons</h4>
                                    <p class="text-muted mt-4">No Cons</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button class="btn btn-love" data-bs-dismiss="modal" onclick="sayYes()">Okay, I choose Yes! ❤️</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function sayYes() {
            document.getElementById('mainQuestion').innerHTML = "It's a Date! ❤️✨";
            const cardBody = document.querySelector('.valentine-card .card-body');
            cardBody.innerHTML = `
                <div class="heart-icon">🎉</div>
                <h2 class="question-text">It's a Date! ❤️</h2>
                <p>I knew the Pros would convince you. See you soon!</p>
            `;
        }
    </script>

</body>
</html>
